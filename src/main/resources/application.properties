spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=false

spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_BATCH_FETCH_SIZE:50}
spring.jpa.properties.hibernate.jdbc.fetch_size=${HIBERNATE_JDBC_FETCH_SIZE:100}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:3000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:30000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:550000}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
# Allow executing migrations that have a lower version than the current schema
# (useful here because V7/V8 were already applied before V6 was fixed)
spring.flyway.out-of-order=false

jwt.secret=change-me-to-a-secure-random-string
jwt.expiration-ms=3600000

# Use port provided by hosting platforms (e.g. Render sets $PORT). Fall back to 8081 for local runs.
server.port=${PORT:8081}
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,text/html,text/xml,text/plain,text/css,application/javascript
server.compression.min-response-size=1024
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:80}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN:10}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:100}

# Ensure servlet encoding (some Spring Boot versions respect these)
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Upload configuration for attachments
# max size in bytes (default 5 MB)
upload.max-size=5242880
# comma-separated allowed content types
upload.allowed-types=image/png,image/jpeg,image/jpg,image/gif,application/pdf
# upload directory; local dev resolves to D:/IdeaProjects/backend/uploads when app is started from backend/
upload.base-dir=${UPLOAD_BASE_DIR:uploads}
# subdirectory for incident attachments
upload.incidents-dir=incidents
# subdirectory for guest entry photos
upload.guest-entries-dir=guest-entries
